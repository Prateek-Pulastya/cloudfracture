title: Agent Reads Database Credential Secret
id: 8f2b1c30-0a11-4e2a-9c11-cf0100000003
status: experimental
description: >
  Detects the agent execution role retrieving the database-credential secret value
  (CloudFracture Path 3). Driven by a poisoned prompt, the agent reads and leaks the
  credential. Post-remediation the agent must not be able to read this secret.
references:
  - https://attack.mitre.org/techniques/T1552/
  - https://genai.owasp.org/llmrisk/llm06-excessive-agency/
author: CloudFracture
date: 2026/09/01
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName: GetSecretValue
    requestParameters.secretId|contains: 'cloudfracture/app/db-creds'
    userIdentity.sessionContext.sessionIssuer.userName: 'cloudfracture-agent-exec-role'
  condition: selection
falsepositives:
  - Legitimate application retrieval of the credential under the agent role (the
    over-broad access this rule flags). Tune by principal once remediated.
level: high
tags:
  - attack.credential_access
  - attack.t1552
  - attack.t1552.004
  - owasp.llm06
